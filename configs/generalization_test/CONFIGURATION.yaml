excel_path: "./ws_test_file_use.xlsx"
sheet_name: "CONFIGURATION"
subtable_titles:
  - "2G Configuration"
  - "3G Configuration"
  - "4G Configuration"
  - "5G Configuration"

# 废弃旧版的 target_columns，全面拥抱 subtable_configs
subtable_configs:
  "2G Configuration":
    layout: "仅列"          # 明确指定为纵表
    col_headers:            # 对应列方向的表头
      - "SYSTEM MODULE"
      - "CELL"
      - "RF MODULE||TYPE"   # 使用 || 无缝拼接多级表头
      - "RF MODULE||QTY."
      - "ANTENNAS||NEW/SWAP/EXIST"
      - "ANTENNAS||Antenna Type"

  "3G Configuration":
    layout: "仅列"
    col_headers:
      - "SYSTEM MODULE"
      - "CELL"
      - "RF MODULE||TYPE"
      - "RF MODULE||QTY."
      - "ANTENNAS||NEW/SWAP/EXIST"
      - "ANTENNAS||Antenna Type"

  "4G Configuration":
    layout: "仅列"
    col_headers:
      - "RF MODULE||QTY."
      - "ANTENNAS||NEW/SWAP/EXIST"
      - "ANTENNAS||Antenna Type"

  "5G Configuration":
    layout: "仅列"
    col_headers:
      - "SYSTEM MODULE"
      - "CELL"
      - "RF MODULE||TYPE"